# ══════════════════════════════════════════════════════════════════
# Bolo — Core word list (language-agnostic)
# ══════════════════════════════════════════════════════════════════
#
# Each entry defines the structural properties of one word:
#   - id                     : stable identifier (word_NNN)
#   - category               : maps to scene background & session grouping
#   - age_band               : "2-3" | "3-4" | "4-5"
#   - phoneme_targets_ipa    : list of IPA phonemes (drives focused-stim game)
#   - image                  : path to word illustration (relative to assets/)
#   - cdi_frequency_rank     : rank in MacArthur-Bates CDI Words & Gestures
#   - asha_milestone_age_months : typical age of production per ASHA
#   - universal              : true = valid in every language pack by default
#                              false = each pack decides (opt-in in pack manifest)
#
# Translation and audio for each word live in the per-language packs
# under ../packs/<locale>/words.yaml.
#
# MVP starter set: 20 words, balanced across animals/food/family/body.
# ══════════════════════════════════════════════════════════════════

