name: bolo
description: "Bolo — Multilingual speech-play app for toddlers ages 2-5"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Routing ───────────────────────────────────────────────────
  go_router: ^15.1.2

  # ── Local storage (on-device, no cloud) ───────────────────────
  # Using shared_preferences for MVP (isar_generator incompatible with
  # Dart 3.12 / riverpod_generator; swap back to isar once updated)
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # ── Game engine ───────────────────────────────────────────────
  flame: ^1.23.0

  # ── Audio ─────────────────────────────────────────────────────
  audioplayers: ^6.8.1
  flame_audio: ^2.10.5

  # ── Animation ────────────────────────────────────────────────
  lottie: ^3.1.3
  flutter_animate: ^4.5.2

  # ── Speech detection (on-device STT) ─────────────────────────
  speech_to_text: ^7.0.0

  # ── YAML content loading ──────────────────────────────────────
  yaml: ^3.1.2

  # ── Utilities ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.14

  # ── Store-ready icons + splash (build-time only) ─────────────
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ── Launcher icon configuration ─────────────────────────────────
# Run: `dart run flutter_launcher_icons` after regenerating icon.png
flutter_launcher_icons:
  android: true
  ios: false  # iOS scaffold not present — MVP ships Android-only.
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F55D00"
  adaptive_icon_foreground: "assets/branding/icon.png"

# ── Native splash configuration ─────────────────────────────────
# Run: `dart run flutter_native_splash:create` after regenerating splash.png
flutter_native_splash:
  color: "#FFF4E6"
  image: "assets/branding/splash.png"
  android_12:
    icon_background_color: "#FFF4E6"
    image: "assets/branding/icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    # Branding
    - assets/branding/icon.png
    - assets/branding/splash.png

    # Content packs (YAML — loaded at runtime)
    - assets/content/core/words.yaml
    - assets/content/core/milestones.yaml
    - assets/content/packs/en/manifest.yaml
    - assets/content/packs/en/words.yaml
    - assets/content/packs/en/cultural_overrides.yaml
    - assets/content/packs/hi/manifest.yaml
    - assets/content/packs/hi/words.yaml
    - assets/content/packs/hi/cultural_overrides.yaml

    # SFX (WAV — tap, reward, session complete)
    - assets/audio/sfx/tap.wav
    - assets/audio/sfx/reward.wav
    - assets/audio/sfx/session_complete.wav

    # Word audio (WAV — generated by scripts/generate_tts.py)
    - assets/content/packs/en/audio/

    # Images (word illustrations + scenes — added after art generation)
    # - assets/images/words/
    # - assets/images/scenes/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    # Bundled locally so the app never contacts fonts.gstatic.com at runtime.
    # Nunito ships as a variable font (wght 200–1000); Flutter selects the
    # nearest weight via fontWeight in TextStyle. See lib/core/theme/.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Variable.ttf
