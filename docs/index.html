<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bolo</title>
  <style>
    :root {
      --paper: #FFF4E6;
      --ink:   #1C0E06;
      --ink3:  #7A5A44;
      --saffron: #F55D00;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 96px; height: 96px;
      border-radius: 22px;
      background: var(--saffron);
      color: white;
      font: 800 60px/96px -apple-system, sans-serif;
      margin: 0 auto 20px;
      box-shadow: 0 10px 24px rgba(196,63,0,.22);
    }
    h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: -0.01em; }
    .sub { color: var(--ink3); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; }
    .links { margin-top: 28px; }
    a {
      color: var(--saffron);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 18px;
      border: 1.5px solid var(--saffron);
      border-radius: 999px;
      display: inline-block;
    }
    a:hover { background: var(--saffron); color: white; }
  </style>
</head>
<body>
  <main>
    <div class="logo">B</div>
    <div class="sub">A speech-play space</div>
    <h1>Bolo</h1>
    <p style="max-width: 42ch; margin: 20px auto 0; color: var(--ink3);">
      A gentle multilingual word-play app for toddlers aged 2 – 5.
    </p>
    <div class="links">
      <a href="./privacy/">Privacy Policy</a>
    </div>
  </main>
</body>
</html>
