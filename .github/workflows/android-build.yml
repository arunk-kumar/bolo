name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build signed release AAB (requires KEYSTORE_* secrets)"
        type: boolean
        default: false

jobs:
  # ── Debug APK — always builds; anyone can sideload for testing ────
  debug-apk:
    name: Debug APK (sideloadable)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Doctor summary
        working-directory: app
        run: flutter doctor -v

      - name: Restore packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bolo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── Release AAB — only when manually dispatched with release=true ──
  # Requires these repo secrets (add via Settings → Secrets → Actions):
  #   KEYSTORE_BASE64        → base64-encoded upload-keystore.jks
  #   KEYSTORE_PASSWORD      → keystore password
  #   KEY_ALIAS              → key alias inside the keystore
  #   KEY_PASSWORD           → password for that alias
  release-aab:
    name: Signed release AAB (Play Store upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: app
        run: flutter pub get

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: bolo-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Scrub secrets
        if: always()
        run: |
          rm -f app/android/app/upload-keystore.jks
          rm -f app/android/key.properties
